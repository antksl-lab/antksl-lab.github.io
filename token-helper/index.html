<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANTKSL — Студийные истории (альбом)</title>
<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
<style>
 body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;margin:0;padding:16px;background:#0f1116;color:#e8eaed}
 h1{font-size:18px;margin:0 0 12px}
 input,button{width:100%;box-sizing:border-box;font-size:15px;padding:12px;border-radius:10px;border:1px solid #2a2f3a}
 input{background:#171a21;color:#e8eaed;margin-bottom:10px}
 button{background:#2787f5;color:#fff;border:0;margin-bottom:10px}
 button:disabled{background:#39404d}
 pre{white-space:pre-wrap;background:#171a21;border-radius:10px;padding:12px;font-size:13px;line-height:1.45}
 .job{background:#171a21;border-radius:10px;padding:12px;margin-bottom:10px}
</style>
</head>
<body>
<h1>Студийные истории → фотоальбом</h1>
<input id="code" placeholder="Код подключения из окна моста" autocomplete="off">
<button id="connect">Подключиться к мосту</button>
<button id="checkauth">Проверить право photos (без записи)</button>
<div id="jobs"></div>
<pre id="log">Готов.</pre>
<script>
const bridge = window.vkBridge;
const INIT = bridge.send("VKWebAppInit", {});
let BASE = "", KEY = "", CFG = null;
const log = (m) => { const el = document.getElementById("log");
  el.textContent = (new Date()).toLocaleTimeString() + "  " + m + "\n" + el.textContent; };

function withTimeout(promise, ms, label){
  let timer;
  const timeout = new Promise((_, reject) => {
    timer = setTimeout(() => reject(new Error(label + ": превышено время ожидания")), ms);
  });
  return Promise.race([promise, timeout]).finally(() => clearTimeout(timer));
}

function nonce(){ const a = new Uint8Array(16); crypto.getRandomValues(a);
  return Array.from(a, b => b.toString(16).padStart(2,"0")).join(""); }

async function call(path, body){
  const r = await withTimeout(fetch(BASE + path, {
    method: body ? "POST" : "GET",
    headers: {"Content-Type":"application/json","X-ANTKSL-Session":KEY},
    body: body ? JSON.stringify(body) : undefined }), 30000, "Мост " + path);
  const j = await r.json();
  if(!j.ok) throw new Error(j.error || ("HTTP " + r.status));
  return j;
}

// Пользовательский ключ живёт только в этой переменной и только в браузере.
// Он не уходит на мост, не пишется в localStorage и не печатается в журнал.
let USER_TOKEN = null;

async function auth(){
  if(USER_TOKEN) return USER_TOKEN;
  await withTimeout(INIT, 30000, "VKWebAppInit");
  const res = await withTimeout(bridge.send("VKWebAppGetAuthToken",
    { app_id: CFG.app_id, scope: CFG.scope }), 90000, "Запрос права photos");
  const granted = String(res.scope || "").split(",").filter(Boolean);
  if(!granted.includes("photos"))
    throw new Error("Право photos не выдано. Без него альбом недоступен.");
  USER_TOKEN = res.access_token;
  log("Право photos получено. Ключ остаётся в браузере.");
  return USER_TOKEN;
}

async function api(method, params){
  const token = await auth();
  const res = await withTimeout(bridge.send("VKWebAppCallAPIMethod", {
    method: method,
    params: Object.assign({ v: CFG.api_version, access_token: token }, params) }),
    90000, method);
  if(res.error_type) throw new Error(method + ": " + JSON.stringify(res.error_data));
  return res.response;
}

async function listAllAlbums(){
  const all = [];
  let offset = 0;
  for(let page = 0; page < 20; page++){
    const part = await api("photos.getAlbums", {
      owner_id: -CFG.group_id, need_system: 0, count: 1000, offset: offset });
    const items = (part && part.items) || [];
    all.push(...items);
    if(!items.length || items.length < 1000 ||
       (Number(part.count || 0) > 0 && all.length >= Number(part.count))) break;
    offset += items.length;
  }
  return all;
}

async function ensureAlbum(){
  const items = await listAllAlbums();
  const norm = (s) => String(s || "").trim().toLocaleLowerCase("ru-RU");
  if(CFG.album_id){
    const known = items.find(a => Number(a.id) === Number(CFG.album_id));
    if(!known) throw new Error("Сохранённый album_id не найден в сообществе.");
    if(norm(known.title) !== norm(CFG.album_exact_title))
      throw new Error("Сохранённый album_id принадлежит альбому с другим названием.");
    if(Number(known.owner_id || -CFG.group_id) !== -Number(CFG.group_id))
      throw new Error("Сохранённый album_id принадлежит другому владельцу.");
    return { id: known.id, owner_id: known.owner_id || -CFG.group_id, created: false };
  }
  let found = items.find(a => norm(a.title) === norm(CFG.album_exact_title));
  let reservation = "";
  if(found){ log("Альбом найден: " + found.id); }
  else {
    const reserved = await call("/album-reserve", { title: CFG.album_exact_title });
    if(reserved.known_album_id){
      throw new Error("Мост уже знает album_id; переподключитесь и повторите проверку.");
    }
    reservation = reserved.reservation;
    log("Альбом не найден — создание зарезервировано одной вкладкой.");
    found = await api("photos.createAlbum", {
      title: CFG.album_exact_title, group_id: CFG.group_id,
      description: CFG.album_description, upload_by_admins_only: 1 });
    found.created = true;
  }
  const owner = found.owner_id || -CFG.group_id;
  await call("/album", { album_id: found.id, owner_id: owner,
    title: CFG.album_exact_title, created: !!found.created, reservation: reservation });
  CFG.album_id = found.id;
  return { id: found.id, owner_id: owner, created: !!found.created };
}

// Сохраняем только НЕСЕКРЕТНОЕ доказательство photo_id. Пользовательский
// access_token никогда не попадает в localStorage. Это позволяет после
// перезагрузки страницы дослать /result без повторной загрузки фотографии.
const SAVED = {};
function proofKey(jobId){ return "antksl_album_proof:" + CFG.app_id + ":" + CFG.group_id + ":" + jobId; }
function loadProof(jobId){
  try { return JSON.parse(localStorage.getItem(proofKey(jobId)) || "null"); }
  catch(_){ return null; }
}
function saveProof(jobId, proof){
  SAVED[jobId] = proof;
  localStorage.setItem(proofKey(jobId), JSON.stringify(proof));
}
function clearProof(jobId){
  delete SAVED[jobId];
  localStorage.removeItem(proofKey(jobId));
}

async function publish(job, button){
  button.disabled = true;
  const n = nonce();
  try {
    const prior = SAVED[job.job_id] || loadProof(job.job_id);
    if(prior){
      const s = prior;
      log("Фотография уже сохранена, досылаю результат без повторной загрузки.");
      await call("/result", Object.assign({ job_id: job.job_id, success: true }, s));
      clearProof(job.job_id);
      log("ГОТОВО (досыл). photo_id=" + s.photo_id);
      button.textContent = "Загружено"; return;
    }
    const album = await ensureAlbum();
    const srv = await api("photos.getUploadServer",
      { album_id: album.id, group_id: CFG.group_id });
    log("Сервер загрузки получен.");
    const up = await call("/upload", { job_id: job.job_id, media_type: "photo",
      upload_url: srv.upload_url, nonce: n });
    log("Файл загружен мостом.");
    const saved = await api("photos.save", {
      album_id: album.id, group_id: CFG.group_id,
      server: up.upload.server, photos_list: up.upload.photos_list,
      hash: up.upload.hash, caption: job.caption });
    const photo = Array.isArray(saved) ? saved[0] : (saved.items || [])[0];
    if(!photo || !photo.id) throw new Error("photos.save не вернул фотографию.");
    // Независимая проверка: где фотография оказалась на самом деле.
    const back = await api("photos.getById",
      { photos: photo.owner_id + "_" + photo.id, extended: 0 });
    const got = Array.isArray(back) ? back[0] : (back.items || [])[0];
    if(!got) throw new Error("photos.getById не нашёл сохранённую фотографию.");
    const proof = { album_id: album.id, owner_id: photo.owner_id, photo_id: photo.id,
      verified_album_id: got.album_id, verified_owner_id: got.owner_id };
    saveProof(job.job_id, proof);
    await call("/result", Object.assign({ job_id: job.job_id, success: true, nonce: n }, proof));
    clearProof(job.job_id);
    log("ГОТОВО. photo_id=" + photo.id + "; альбом подтверждён photos.getById; " +
        "запись на стене не создавалась.");
    button.textContent = "Загружено";
  } catch(e){
    log("ОШИБКА: " + e.message);
    try { await call("/result", { job_id: job.job_id, success: false,
      error: String(e.message), nonce: n }); } catch(_){}
    button.disabled = false;
  }
}

document.getElementById("checkauth").onclick = async () => {
  try {
    if(!CFG) throw new Error("Сначала подключитесь к мосту.");
    const t = await auth();
    const me = await api("photos.getAlbums",
      { owner_id: -CFG.group_id, need_system: 0, count: 1 });
    log("ПРОВЕРКА ПРОЙДЕНА: право photos действует, альбомы читаются (" +
        (me.count === undefined ? "?" : me.count) + " шт.). Ничего не записано.");
  } catch(e){ log("ПРОВЕРКА НЕ ПРОЙДЕНА: " + e.message); }
};

document.getElementById("connect").onclick = async () => {
  try {
    const raw = document.getElementById("code").value.trim();
    const cut = raw.lastIndexOf("|");
    if(cut < 0) throw new Error("Код подключения должен содержать символ |.");
    BASE = raw.slice(0, cut); KEY = raw.slice(cut + 1);
    while(BASE.endsWith("/")) BASE = BASE.slice(0, -1);
    const bridgeUrl = new URL(BASE);
    if(bridgeUrl.protocol !== "https:" ||
       !bridgeUrl.hostname.endsWith(".trycloudflare.com") ||
       bridgeUrl.pathname !== "/" || bridgeUrl.username || bridgeUrl.password)
      throw new Error("Ожидается корневой HTTPS-адрес *.trycloudflare.com.");
    CFG = await call("/config");
    log("Мост " + CFG.engine_version + "; альбом «" + CFG.album_exact_title + "».");
    if(CFG.probe_only) log("РЕЖИМ ПРОВЕРКИ: запись отключена мостом.");
    const jobs = (await call("/jobs")).jobs || [];
    const box = document.getElementById("jobs"); box.innerHTML = "";
    if(!jobs.length) log("Заданий в состоянии queued нет.");
    jobs.forEach(job => {
      const d = document.createElement("div"); d.className = "job";
      d.innerHTML = "<b>" + job.story_id + "</b><br>" + job.media_name +
        " · " + job.media_size + " байт";
      const b = document.createElement("button");
      b.textContent = CFG.probe_only
        ? "Режим проверки: загрузка отключена мостом"
        : "Загрузить в альбом";
      b.disabled = !!CFG.probe_only;
      b.onclick = () => publish(job, b);
      d.appendChild(b); box.appendChild(d);
    });
  } catch(e){ log("ОШИБКА: " + e.message); }
};
</script>
</body>
</html>
