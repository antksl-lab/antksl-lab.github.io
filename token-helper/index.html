<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ANTKSL · Hybrid Photo Probe 1.0</title>
  <script src="https://unpkg.com/@vkontakte/vk-bridge@2.15.0/dist/browser.min.js"></script>
  <style>
    :root{font-family:Arial,sans-serif;color:#162133;background:#eef2f7}
    *{box-sizing:border-box}
    body{margin:0;padding:24px}
    main{max-width:780px;margin:24px auto;background:#fff;border-radius:20px;padding:28px;box-shadow:0 12px 40px #0002}
    h1{font-size:27px;margin:0 0 10px}
    .muted{color:#657084;line-height:1.55}
    label{display:block;font-weight:700;color:#39465a;margin:18px 0}
    input{display:block;width:100%;margin-top:7px;padding:12px;border:1px solid #cbd4e1;border-radius:10px;font-size:16px}
    button{border:0;border-radius:12px;padding:14px 18px;font-size:16px;font-weight:700;cursor:pointer;background:#2688eb;color:#fff;margin:8px 8px 8px 0}
    button.secondary{background:#e9eef6;color:#17223b}
    button:disabled{opacity:.45;cursor:not-allowed}
    #status{padding:15px;border-radius:12px;background:#f3f6fa;white-space:pre-wrap;line-height:1.48;min-height:120px}
    #attachmentBox{display:none;margin-top:16px;padding:14px;border:1px solid #b9c8da;border-radius:12px;background:#f8fbff}
    #attachment{word-break:break-all;font-family:Consolas,monospace}
    code{background:#edf1f6;padding:2px 6px;border-radius:5px}
  </style>
</head>
<body>
<main>
  <h1>ANTKSL · гибридная проверка фотографии</h1>
  <p class="muted">
    Эта страница создаёт одну тестовую фотографию в альбоме стены сообщества
    <b>239543600</b>. Она не вызывает <code>wall.post</code>, не публикует запись
    и не меняет <code>queue.json</code>.
  </p>

  <label>Код подключения из чёрного окна
    <input id="connection" type="password" autocomplete="off"
           placeholder="Вставьте всю строку после «Код подключения:»">
  </label>

  <button id="connect">1. Подключиться к Python</button>
  <button id="auth" class="secondary" disabled>2. Получить токен VK</button>
  <button id="upload" disabled>3. Загрузить карточку в сообщество</button>

  <div id="attachmentBox">
    <b>Готовый идентификатор вложения:</b>
    <p id="attachment"></p>
    <button id="copy" class="secondary">Скопировать идентификатор</button>
  </div>

  <p id="status">Инициализация VK Bridge…</p>
</main>

<script>
(() => {
  'use strict';

  const EXPECTED_GROUP_ID = 239543600;
  const PROTECTED_JOB_ID = '3313ccfb1ca4';

  const $ = id => document.getElementById(id);
  const status = $('status');
  const connectBtn = $('connect');
  const authBtn = $('auth');
  const uploadBtn = $('upload');
  const copyBtn = $('copy');
  const attachmentBox = $('attachmentBox');
  const attachmentText = $('attachment');

  let appId = Number(new URLSearchParams(location.search).get('vk_app_id') || 0);
  let base = '';
  let sessionKey = '';
  let config = null;
  let job = null;
  let token = '';
  let attachment = '';
  let lines = [];

  function resetLog(text) {
    lines = [text];
    status.textContent = lines.join('\n');
  }

  function log(text) {
    lines.push(text);
    status.textContent = lines.join('\n');
  }

  function errorText(error) {
    return error?.error_data?.error_reason ||
           error?.error_data?.error_msg ||
           error?.message ||
           String(error);
  }

  function parseConnection(value) {
    const raw = value.trim();
    const separator = raw.lastIndexOf('|');
    if (separator < 1) {
      throw new Error('Вставьте полный код подключения из чёрного окна.');
    }

    const url = new URL(raw.slice(0, separator));
    const key = raw.slice(separator + 1);
    const labels = url.hostname.toLowerCase().split('.');
    const validHost =
      labels.length === 3 &&
      labels[0] &&
      labels[1] === 'trycloudflare' &&
      labels[2] === 'com';

    if (
      url.protocol !== 'https:' ||
      !validHost ||
      url.username ||
      url.password ||
      (url.pathname !== '/' && url.pathname !== '') ||
      url.search ||
      url.hash
    ) {
      throw new Error('Код не содержит допустимый одноразовый HTTPS-адрес.');
    }

    if (!/^[A-Za-z0-9_-]{20,100}$/.test(key)) {
      throw new Error('Код сессии повреждён или скопирован не полностью.');
    }

    return {base: url.origin, key};
  }

  async function local(path, options = {}) {
    const headers = {
      ...(options.headers || {}),
      'X-ANTKSL-Session': sessionKey
    };
    if (options.body) headers['Content-Type'] = 'application/json';

    const response = await fetch(base + path, {
      ...options,
      headers,
      cache: 'no-store'
    });

    const data = await response.json().catch(() => ({
      ok: false,
      error: 'Python вернул не JSON'
    }));

    if (!response.ok || !data.ok) {
      throw new Error(data.error || `HTTP ${response.status}`);
    }

    return data;
  }

  async function api(method, params = {}) {
    if (!token) throw new Error('Сначала получи токен VK.');

    const data = await vkBridge.send('VKWebAppCallAPIMethod', {
      method,
      params: {
        ...params,
        access_token: token,
        v: String(config.api_version || '5.199')
      }
    });

    return data.response;
  }

  async function init() {
    try {
      await vkBridge.send('VKWebAppInit');

      if (!appId) {
        const launch = await vkBridge.send('VKWebAppGetLaunchParams');
        appId = Number(launch.vk_app_id || 0);
      }

      if (!appId) {
        throw new Error(
          'Не найден vk_app_id. Открой страницу именно внутри VK Mini App.'
        );
      }

      resetLog(
        `VK Bridge готов. App ID: ${appId}\n` +
        'Запусти локальный мост и вставь код подключения.'
      );
    } catch (error) {
      resetLog('ОШИБКА ИНИЦИАЛИЗАЦИИ: ' + errorText(error));
      connectBtn.disabled = true;
    }
  }

  connectBtn.onclick = async () => {
    try {
      connectBtn.disabled = true;
      resetLog('Подключение к локальному Python…');

      const connection = parseConnection($('connection').value);
      base = connection.base;
      sessionKey = connection.key;

      config = await local('/config');
      if (Number(config.group_id) !== EXPECTED_GROUP_ID) {
        throw new Error(
          `Ожидалась группа ${EXPECTED_GROUP_ID}, получена ${config.group_id}.`
        );
      }

      const queue = await local('/jobs');
      const jobs = Array.isArray(queue.jobs) ? queue.jobs : [];
      job = jobs.find(item => String(item.job_id) === PROTECTED_JOB_ID);

      if (!job) {
        throw new Error(
          `В локальной очереди не найдено защищённое задание ${PROTECTED_JOB_ID}.`
        );
      }

      if (String(job.media_type) !== 'photo') {
        throw new Error('Защищённое задание не является фотографией.');
      }

      log(`Подключено. Группа: ${config.group_id}.`);
      log(`Карточка найдена: ${job.media_name || job.story_id || job.job_id}.`);
      log('Очередь будет только прочитана; статус задания не изменится.');
      authBtn.disabled = false;
    } catch (error) {
      log('ОШИБКА ПОДКЛЮЧЕНИЯ: ' + errorText(error));
      connectBtn.disabled = false;
    }
  };

  authBtn.onclick = async () => {
    try {
      authBtn.disabled = true;
      log('VK запрашивает пользовательские права photos и groups…');

      const data = await vkBridge.send('VKWebAppGetAuthToken', {
        app_id: appId,
        scope: 'photos,groups'
      });

      token = String(data.access_token || '');
      if (!token) throw new Error('VK не вернул access_token.');

      const users = await api('users.get');
      const user = Array.isArray(users) ? users[0] : null;
      if (!user?.id) throw new Error('users.get не подтвердил токен.');

      log(`Токен подтверждён. User ID: ${user.id}.`);
      log('Токен остаётся только в памяти страницы.');
      uploadBtn.disabled = false;
    } catch (error) {
      token = '';
      log('ОШИБКА ТОКЕНА: ' + errorText(error));
      authBtn.disabled = false;
    }
  };

  uploadBtn.onclick = async () => {
    try {
      uploadBtn.disabled = true;
      attachment = '';
      attachmentBox.style.display = 'none';

      log('Запрашиваю сервер загрузки для стены сообщества…');
      const server = await api('photos.getWallUploadServer', {
        group_id: EXPECTED_GROUP_ID
      });

      if (!server?.upload_url) {
        throw new Error('photos.getWallUploadServer не вернул upload_url.');
      }

      log('Передаю карточку из локального Python на upload-сервер VK…');
      const sent = await local('/upload', {
        method: 'POST',
        body: JSON.stringify({
          job_id: PROTECTED_JOB_ID,
          media_type: 'photo',
          upload_url: server.upload_url
        })
      });

      const up = sent.upload || {};
      if (!up.photo || up.server == null || !up.hash) {
        throw new Error(
          'Upload-сервер не вернул полный набор photo/server/hash.'
        );
      }

      log('Сохраняю фотографию именно в сообщество 239543600…');
      const saved = await api('photos.saveWallPhoto', {
        group_id: EXPECTED_GROUP_ID,
        photo: up.photo,
        server: up.server,
        hash: up.hash
      });

      const photo = Array.isArray(saved) ? saved[0] : null;
      if (photo?.owner_id == null || photo?.id == null) {
        throw new Error('photos.saveWallPhoto не вернул owner_id и id.');
      }

      const expectedOwner = -EXPECTED_GROUP_ID;
      if (Number(photo.owner_id) !== expectedOwner) {
        throw new Error(
          `Фотография сохранилась не в сообщество: owner_id=${photo.owner_id}, ` +
          `ожидался ${expectedOwner}.`
        );
      }

      attachment = `photo${photo.owner_id}_${photo.id}`;
      if (photo.access_key) attachment += `_${photo.access_key}`;

      attachmentText.textContent = attachment;
      attachmentBox.style.display = 'block';

      log('PASS: фотография принадлежит сообществу.');
      log(`owner_id: ${photo.owner_id}`);
      log(`photo_id: ${photo.id}`);
      log('wall.post НЕ вызывался. queue.json НЕ изменялся.');

      token = '';
      log('Временный пользовательский токен удалён из памяти страницы.');
    } catch (error) {
      token = '';
      log('ОШИБКА ЗАГРУЗКИ: ' + errorText(error));
      authBtn.disabled = false;
    }
  };

  copyBtn.onclick = async () => {
    if (!attachment) return;
    try {
      await navigator.clipboard.writeText(attachment);
      log('Идентификатор вложения скопирован.');
    } catch (error) {
      log('Не удалось скопировать автоматически: ' + errorText(error));
    }
  };

  init();
})();
</script>
</body>
</html>
