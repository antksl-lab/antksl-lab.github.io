name: Promote Token Helper v1.5 fallback

on:
  push:
    paths:
      - '.github/workflows/promote-token-helper-v1-5b.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch helper safely
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('token-helper/index.html')
          s=p.read_text(encoding='utf-8')
          old_build="const HELPER_BUILD='20260817-v1.4';"
          old_boot='bootstrap-v3-same-origin-first'
          old_state="BRIDGE_READY=null,BRIDGE_SOURCE='';"
          old_init="""async function initializeBridge(){
            bridge=await loadBridge();
            INIT=withTimeout(bridge.send('VKWebAppInit',{}),30000,'VKWebAppInit');"""
          old_sub="""    try{
                bridge.subscribe(e=>{
                  if(e&&e.detail&&e.detail.type==='VKWebAppLocationChanged'){
                    maybeAutoConnect((e.detail.data||{}).location||'','LOCATION_CHANGED');
                  }
                });
              }catch(_){}
              return bridge;"""
          for needle,label in [(old_build,'build'),(old_boot,'bootstrap'),(old_state,'state'),(old_init,'init'),(old_sub,'subscription')]:
            if needle not in s:
              raise SystemExit('Expected '+label+' marker missing; refusing blind patch')
          new_init="""function installLocationSubscription(){
            if(LOCATION_SUBSCRIBED||!bridge)return;
            bridge.subscribe(e=>{
              if(e&&e.detail&&e.detail.type==='VKWebAppLocationChanged'){
                const loc=(e.detail.data||{}).location||'';
                safeStage('VK_LOCATION_EVENT',{has_location:Boolean(loc)});
                maybeAutoConnect(loc,'LOCATION_CHANGED_PRE_INIT');
              }
            });
            LOCATION_SUBSCRIBED=true;
            safeStage('VK_LOCATION_SUBSCRIBED_PRE_INIT');
            plog('VK location listener установлен до VKWebAppInit.');
          }
          async function initializeBridge(){
            bridge=await loadBridge();
            installLocationSubscription();
            INIT=withTimeout(bridge.send('VKWebAppInit',{}),30000,'VKWebAppInit');"""
          s=s.replace(old_build,"const HELPER_BUILD='20260818-v1.5';",1)
          s=s.replace(old_boot,'bootstrap-v4-pre-init-location-subscribe',1)
          s=s.replace(old_state,"BRIDGE_READY=null,BRIDGE_SOURCE='',LOCATION_SUBSCRIBED=false;",1)
          s=s.replace(old_init,new_init,1)
          s=s.replace(old_sub,"    return bridge;",1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify ordering and token boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('token-helper/index.html').read_text(encoding='utf-8')
          assert "HELPER_BUILD='20260818-v1.5'" in s
          assert 'bootstrap-v4-pre-init-location-subscribe' in s
          assert "'./vendor/vk-bridge-2.15.0.min.js'" in s
          assert s.count("e.detail.type==='VKWebAppLocationChanged'")==1
          call=s.index('installLocationSubscription();')
          init=s.index("INIT=withTimeout(bridge.send('VKWebAppInit',{})")
          assert call < init
          for marker in ['VK_LOCATION_SUBSCRIBED_PRE_INIT','VK_LOCATION_EVENT','LOCATION_CHANGED_PRE_INIT']:
            assert marker in s
          assert 'clipboard.writeText' not in s
          assert 'clipboard.readText' not in s
          assert '?access_token=' not in s and '&access_token=' not in s
          PY
      - name: Commit v1.5
        shell: bash
        run: |
          set -euo pipefail
          git config user.name antksl-helper-bot
          git config user.email antksl-helper-bot@users.noreply.github.com
          git add token-helper/index.html
          git commit -m 'Promote VK Token Helper v1.5 pre-init location subscription'
          git push
