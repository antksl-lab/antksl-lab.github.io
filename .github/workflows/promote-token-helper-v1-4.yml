name: Promote Token Helper v1.4

on:
  push:
    paths:
      - '.github/workflows/promote-token-helper-v1-4.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Promote Helper to same-origin-first v1.4
        shell: python
        run: |
          from pathlib import Path
          p = Path('token-helper/index.html')
          s = p.read_text(encoding='utf-8')

          old_sources = """const BRIDGE_SOURCES=[
            'https://unpkg.com/@vkontakte/vk-bridge@2.15.0/dist/browser.min.js',
            'https://cdn.jsdelivr.net/npm/@vkontakte/vk-bridge@2.15.0/dist/browser.min.js'
          ];"""
          new_sources = """const BRIDGE_SOURCES=[
            './vendor/vk-bridge-2.15.0.min.js',
            'https://unpkg.com/@vkontakte/vk-bridge@2.15.0/dist/browser.min.js',
            'https://cdn.jsdelivr.net/npm/@vkontakte/vk-bridge@2.15.0/dist/browser.min.js'
          ];"""

          checks = [
              ("const HELPER_BUILD='20260817-v1.3';", "v1.3 build marker"),
              (old_sources, "v1.3 bridge sources"),
              ("bootstrap-v2", "bootstrap marker"),
              ("BRIDGE_READY=null;", "runtime state marker"),
              ("bridge=window.vkBridge;\n      plog('VK Bridge JS загружен: источник '+(i+1)+'.');\n      return bridge;", "load success marker"),
              ("version:String(client.version||'')", "init telemetry marker"),
          ]
          for needle, label in checks:
              if needle not in s:
                  raise SystemExit(f'Expected {label} not found; refusing blind patch')

          s = s.replace("const HELPER_BUILD='20260817-v1.3';", "const HELPER_BUILD='20260817-v1.4';", 1)
          s = s.replace(old_sources, new_sources, 1)
          s = s.replace('bootstrap-v2', 'bootstrap-v3-same-origin-first', 1)
          s = s.replace('BRIDGE_READY=null;', "BRIDGE_READY=null,BRIDGE_SOURCE='';", 1)
          s = s.replace(
              "bridge=window.vkBridge;\n      plog('VK Bridge JS загружен: источник '+(i+1)+'.');\n      return bridge;",
              "bridge=window.vkBridge;\n      BRIDGE_SOURCE=src;\n      plog('VK Bridge JS загружен: источник '+(i+1)+' · '+(src.startsWith('./')?'SAME_ORIGIN_VENDOR':'EXTERNAL_FALLBACK')+'.');\n      await safeStage('VK_BRIDGE_LOADED',{source:src.startsWith('./')?'SAME_ORIGIN_VENDOR':src});\n      return bridge;",
              1,
          )
          s = s.replace(
              "version:String(client.version||'')",
              "version:String(client.version||''),bridge_source:(BRIDGE_SOURCE.startsWith('./')?'SAME_ORIGIN_VENDOR':BRIDGE_SOURCE)",
              1,
          )

          p.write_text(s, encoding='utf-8')

      - name: Static invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "HELPER_BUILD='20260817-v1.4'" token-helper/index.html
          grep -Fq "./vendor/vk-bridge-2.15.0.min.js" token-helper/index.html
          grep -Fq "bootstrap-v3-same-origin-first" token-helper/index.html
          test -s token-helper/vendor/vk-bridge-2.15.0.min.js
          test -s token-helper/vendor/VK_BRIDGE_LICENSE.txt
          test -s token-helper/vendor/VK_BRIDGE_2_15_0_PROVENANCE.md
          ! grep -Fq "HELPER_BUILD='20260817-v1.3'" token-helper/index.html

      - name: Commit v1.4
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "antksl-helper-bot"
          git config user.email "antksl-helper-bot@users.noreply.github.com"
          git add token-helper/index.html
          git commit -m "Promote VK Token Helper v1.4 to same-origin Bridge first"
          git push
