name: Vendor VK Bridge 2.15.0

on:
  push:
    paths:
      - '.github/workflows/vendor-vk-bridge-2.15.0.yml'

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch exact npm package and verify identity
        shell: bash
        run: |
          set -euo pipefail
          npm pack @vkontakte/vk-bridge@2.15.0
          TGZ="vkontakte-vk-bridge-2.15.0.tgz"
          test -f "$TGZ"
          TGZ_SHA=$(sha256sum "$TGZ" | awk '{print $1}')
          mkdir -p .vendor_tmp
          tar -xzf "$TGZ" -C .vendor_tmp
          test "$(node -p "require('./.vendor_tmp/package/package.json').name")" = "@vkontakte/vk-bridge"
          test "$(node -p "require('./.vendor_tmp/package/package.json').version")" = "2.15.0"
          test -f .vendor_tmp/package/dist/browser.min.js
          test -f .vendor_tmp/package/LICENSE
          JS_SHA=$(sha256sum .vendor_tmp/package/dist/browser.min.js | awk '{print $1}')
          LICENSE_SHA=$(sha256sum .vendor_tmp/package/LICENSE | awk '{print $1}')
          mkdir -p token-helper/vendor
          cp .vendor_tmp/package/dist/browser.min.js token-helper/vendor/vk-bridge-2.15.0.min.js
          cp .vendor_tmp/package/LICENSE token-helper/vendor/VK_BRIDGE_LICENSE.txt
          cat > token-helper/vendor/VK_BRIDGE_2_15_0_PROVENANCE.md <<EOF
          # VK Bridge 2.15.0 vendored provenance

          - npm package: \`@vkontakte/vk-bridge@2.15.0\`
          - package repository: \`VKCOM/vk-bridge\`
          - official Git tag commit: \`de813fc42fe3c2b490ee1ec56adf712fb177c601\`
          - npm tarball: \`$TGZ\`
          - npm tarball SHA-256: \`$TGZ_SHA\`
          - vendored browser file: \`vk-bridge-2.15.0.min.js\`
          - vendored browser file SHA-256: \`$JS_SHA\`
          - vendored LICENSE SHA-256: \`$LICENSE_SHA\`
          - package license field: \`$(node -p "require('./.vendor_tmp/package/package.json').license")\`

          Generated by GitHub Actions from the exact npm package; no source transformation was performed.
          EOF
          rm -rf .vendor_tmp "$TGZ"

      - name: Commit verified vendor files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "antksl-vendor-bot"
          git config user.email "antksl-vendor-bot@users.noreply.github.com"
          git add token-helper/vendor/vk-bridge-2.15.0.min.js token-helper/vendor/VK_BRIDGE_LICENSE.txt token-helper/vendor/VK_BRIDGE_2_15_0_PROVENANCE.md
          if git diff --cached --quiet; then
            echo "No vendor changes"
            exit 0
          fi
          git commit -m "Vendor verified VK Bridge 2.15.0 browser build"
          git push
