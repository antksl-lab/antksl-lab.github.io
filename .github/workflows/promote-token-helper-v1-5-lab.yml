name: LAB Promote Token Helper v1.5 Pre-Init Location Subscription

on:
  push:
    branches:
      - lab-token-helper-v1-5-preinit-location-subscribe-20260818
    paths:
      - '.github/workflows/promote-token-helper-v1-5-lab.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Promote v1.4 to lab v1.5
        shell: python
        run: |
          from pathlib import Path
          p=Path('token-helper/index.html')
          s=p.read_text(encoding='utf-8')
          old_build="const HELPER_BUILD='20260817-v1.4';"
          old_state="let BASE='',KEY='',CFG=null,bridge=null,INIT=null,AUTO_STARTED=false,HELLO_SENT=false,BRIDGE_READY=null,BRIDGE_SOURCE='';"
          new_state="let BASE='',KEY='',CFG=null,bridge=null,INIT=null,AUTO_STARTED=false,HELLO_SENT=false,BRIDGE_READY=null,BRIDGE_SOURCE='',LOCATION_SUBSCRIBED=false;"
          marker="async function loadBridge(){"
          stage_call="await safeStage('VK_BRIDGE_LOADED',{source:src.startsWith('./')?'SAME_ORIGIN_VENDOR':src});"
          for needle,label in [(old_build,'v1.4 build'),(old_state,'state marker'),(marker,'loadBridge marker'),(stage_call,'bridge-loaded stage')]:
            if needle not in s: raise SystemExit('Refusing blind patch; missing '+label)
          if s.count('bridge.subscribe(e=>{')!=1: raise SystemExit('Expected exactly one existing location subscription')
          sub_i=s.index('bridge.subscribe(e=>{')
          try_i=s.rfind('try{',0,sub_i)
          end_token='}catch(_){}'
          end_i=s.find(end_token,sub_i)
          if try_i<0 or end_i<0: raise SystemExit('Could not isolate post-init subscription block')
          end_i+=len(end_token)
          post_block=s[try_i:end_i]
          if 'VKWebAppLocationChanged' not in post_block or 'maybeAutoConnect' not in post_block:
            raise SystemExit('Refusing to replace unexpected subscription block')
          helper="""function subscribeLocationEarly(){
            if(LOCATION_SUBSCRIBED||!bridge)return LOCATION_SUBSCRIBED;
            try{
              bridge.subscribe(e=>{
                if(e&&e.detail&&e.detail.type==='VKWebAppLocationChanged'){
                  maybeAutoConnect((e.detail.data||{}).location||'','LOCATION_CHANGED');
                }
              });
              LOCATION_SUBSCRIBED=true;
              plog('VK location listener: SUBSCRIBED_PRE_INIT.');
              safeStage('LOCATION_SUBSCRIBED_PRE_INIT');
              return true;
            }catch(e){
              plog('VK location listener: PRE_INIT_SUBSCRIBE_FAILED: '+e.message);
              safeStage('HELPER_ERROR',{error_code:'LOCATION_PREINIT_SUBSCRIBE_FAILED'});
              return false;
            }
          }

          """
          s=s.replace(old_build,"const HELPER_BUILD='20260818-v1.5';",1)
          s=s.replace('bootstrap-v3-same-origin-first','bootstrap-v4-preinit-location-subscribe',1)
          s=s.replace(old_state,new_state,1)
          s=s.replace(marker,helper+marker,1)
          s=s.replace(stage_call,"subscribeLocationEarly();\n      "+stage_call,1)
          s=s.replace(post_block,'subscribeLocationEarly();',1)
          if s.count('bridge.subscribe(')!=1: raise SystemExit('Expected exactly one bridge.subscribe after patch')
          if s.index('subscribeLocationEarly();') > s.index("bridge.send('VKWebAppInit',{})"): raise SystemExit('Pre-init subscription ordering failed')
          p.write_text(s,encoding='utf-8')
      - name: Static patch invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "HELPER_BUILD='20260818-v1.5'" token-helper/index.html
          grep -Fq 'bootstrap-v4-preinit-location-subscribe' token-helper/index.html
          grep -Fq 'LOCATION_SUBSCRIBED_PRE_INIT' token-helper/index.html
          grep -Fq './vendor/vk-bridge-2.15.0.min.js' token-helper/index.html
          ! grep -Fq "HELPER_BUILD='20260817-v1.4'" token-helper/index.html
      - name: Commit lab v1.5
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'antksl-helper-bot'
          git config user.email 'antksl-helper-bot@users.noreply.github.com'
          git add token-helper/index.html
          git commit -m 'LAB Token Helper v1.5 subscribe location before VK init'
          git push
