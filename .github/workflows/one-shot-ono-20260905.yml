name: One-shot publish Оно уже не сверху, а внутри

on:
  push:
    branches:
      - main
    paths:
      - '.antksl_site_update/ARM_ONO_20260905'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rebuild cover and patch current site
        shell: bash
        run: |
          set -euo pipefail
          test -f .antksl_site_update/ARM_ONO_20260905
          python -m py_compile .antksl_site_update/patch_ono_site.py
          mkdir -p assets/covers
          cat .antksl_site_update/cover.part*.b64 | base64 -d > assets/covers/ono-vnutri.webp
          echo '4dd68137898d708a1fd4ed491359a3629e582ecb5a1198b3a55cc404e84a136e  assets/covers/ono-vnutri.webp' | sha256sum -c -
          python .antksl_site_update/patch_ono_site.py index.html
          grep -Fq 'Оно уже не сверху, а внутри' index.html
          grep -Fq '"numberOfItems": 18' index.html
          grep -Fq 'https://antksl.band.link/onovnutri' index.html
          grep -Fq 'data-clip="r17"' index.html
          grep -Fq 'data-yt="nGgwPP1vVuU"' index.html
          grep -Fq 'data-vk-id="456239068"' index.html
          test "$(wc -c < assets/covers/ono-vnutri.webp)" -eq 67318

      - name: Commit final site bytes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'antksl-site-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html assets/covers/ono-vnutri.webp
          git diff --cached --check
          git diff --cached --quiet && { echo 'NO_SITE_CHANGE'; exit 1; }
          git commit -m 'Add «Оно уже не сверху, а внутри» release'
          git push origin HEAD:main
          echo 'ONE_SHOT_SITE_UPDATE=PASS'
