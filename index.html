<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ANTKSL · VK Bridge Token Test</title>
  <script src="https://unpkg.com/@vkontakte/vk-bridge@2.15.0/dist/browser.min.js"></script>
  <style>
    :root{font-family:Arial,sans-serif;color:#162133;background:#eef2f7}
    body{margin:0;padding:24px}
    main{max-width:680px;margin:30px auto;background:#fff;border-radius:20px;padding:28px;box-shadow:0 12px 40px #0002}
    h1{font-size:27px;margin:0 0 10px}.muted{color:#657084;line-height:1.55}
    button{border:0;border-radius:12px;padding:14px 18px;font-size:17px;font-weight:700;cursor:pointer;background:#2688eb;color:#fff;margin:8px 8px 8px 0}
    button.secondary{background:#e9eef6;color:#17223b}button:disabled{opacity:.5;cursor:not-allowed}
    #status{padding:14px;border-radius:12px;background:#f3f6fa;white-space:pre-wrap;line-height:1.45}
    #status[data-kind="ok"]{background:#e9f8ee;color:#155c2d}
    #status[data-kind="error"]{background:#fff0f0;color:#8b1d1d}
    code{background:#edf1f6;padding:2px 6px;border-radius:5px}
  </style>
</head>
<body>
<main>
  <h1>ANTKSL · проверка токена внутри VK Bridge</h1>
  <p class="muted">Страница должна быть открыта <b>внутри VK Mini App</b>. Она получает токен с правами <code>photos</code>, <code>wall</code>, <code>video</code>, <code>groups</code>, а затем проверяет <code>users.get</code> через <code>VKWebAppCallAPIMethod</code>. Токен не сохраняется и полностью на экран не выводится.</p>
  <button id="get">Получить и проверить токен</button>
  <button id="copy" class="secondary" disabled>Скопировать токен после PASS</button>
  <p id="status">Инициализация VK Bridge…</p>
</main>
<script>
(() => {
  const status = document.getElementById('status');
  const getBtn = document.getElementById('get');
  const copyBtn = document.getElementById('copy');
  let token = '';
  let appId = Number(new URLSearchParams(location.search).get('vk_app_id') || 0);

  function show(text, kind = '') {
    status.textContent = text;
    status.dataset.kind = kind;
  }

  function errorText(error) {
    if (error && error.error_data) {
      return String(
        error.error_data.error_reason ||
        error.error_data.error_msg ||
        error.error_data.error_type ||
        JSON.stringify(error.error_data)
      );
    }
    return String(error && error.message ? error.message : error);
  }

  async function init() {
    try {
      await vkBridge.send('VKWebAppInit');
      if (!appId) {
        const launch = await vkBridge.send('VKWebAppGetLaunchParams');
        appId = Number(launch.vk_app_id || 0);
      }
      if (!appId) {
        throw new Error('Не найден vk_app_id. Откройте страницу именно как VK Mini App.');
      }
      show('VK Bridge готов. App ID: ' + appId + '\nНажмите «Получить и проверить токен».');
    } catch (error) {
      show('ОШИБКА ИНИЦИАЛИЗАЦИИ VK BRIDGE\n' + errorText(error), 'error');
      getBtn.disabled = true;
    }
  }

  getBtn.onclick = async () => {
    let stage = 'получения токена';
    try {
      token = '';
      getBtn.disabled = true;
      copyBtn.disabled = true;
      show('VK запрашивает разрешения…');

      const authData = await vkBridge.send('VKWebAppGetAuthToken', {
        app_id: appId,
        scope: 'photos,wall,video,groups'
      });

      token = String(authData.access_token || '');
      if (!token) {
        throw new Error('VK не вернул access_token.');
      }

      const rights = String(authData.scope || '');
      const masked = token.slice(0, 8) + '…' + token.slice(-6);
      stage = 'проверки users.get внутри VK Bridge';
      show(
        'Токен получен.\n' +
        'Выданные права: ' + rights + '\n' +
        'Токен: ' + masked + '\n\n' +
        'Проверяю users.get через VKWebAppCallAPIMethod…'
      );

      const apiData = await vkBridge.send('VKWebAppCallAPIMethod', {
        method: 'users.get',
        params: {
          access_token: token,
          v: '5.199'
        }
      });

      const users = apiData && Array.isArray(apiData.response) ? apiData.response : [];
      if (!users.length || !users[0] || !users[0].id) {
        throw new Error('VK Bridge не вернул пользователя в response.');
      }

      copyBtn.disabled = false;
      getBtn.disabled = false;
      show(
        'VK BRIDGE TEST: PASS\n' +
        'users.get: PASS\n' +
        'User ID: ' + users[0].id + '\n' +
        'Выданные права: ' + rights + '\n' +
        'Токен: ' + masked + '\n\n' +
        'Токен работает внутри VK Bridge.\n' +
        'Сделайте снимок этого результата. vk-token-import пока не запускайте.',
        'ok'
      );
    } catch (error) {
      token = '';
      copyBtn.disabled = true;
      getBtn.disabled = false;
      show(
        'VK BRIDGE TEST: FAIL\n' +
        'Этап: ' + stage + '\n' +
        'Ошибка: ' + errorText(error) + '\n\n' +
        'Сделайте снимок этого результата. vk-token-import не запускайте.',
        'error'
      );
    }
  };

  copyBtn.onclick = async () => {
    if (!token) return;
    try {
      await navigator.clipboard.writeText(token);
    } catch (_) {
      const ta = document.createElement('textarea');
      ta.value = token;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    show(
      'VK BRIDGE TEST: PASS\n' +
      'Токен скопирован после успешной проверки внутри VK Bridge.\n' +
      'vk-token-import пока не запускайте.',
      'ok'
    );
  };

  init();
})();
</script>
</body>
</html>
